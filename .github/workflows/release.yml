name: Release

# Push a tag like v0.2.0 or v0.2.0-beta and this workflow builds every
# distributable (installer, portable, lite, update feed, checksums) and
# publishes a GitHub Release. Tags containing '-' are marked pre-release.
# workflow_dispatch runs a dry build that only uploads workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '^refs/tags/v', '' } else { '0.0.1-ci' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Check tag matches Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # The props version drives local/CI builds; the tag drives releases. If they
          # drift, the repo lies about what shipped — refuse to release until they agree.
          $v = '${{ steps.ver.outputs.version }}'
          $props = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($props -ne $v) {
            Write-Host "::error::Tag v$v does not match <Version>$props</Version> in Directory.Build.props. Bump the props file and re-tag."
            exit 1
          }

      - name: Test
        shell: pwsh
        run: |
          # Tag pushes never trigger ci.yml, so a broken commit tagged directly would
          # ship to every install via the update feed. Test here, before anything packs.
          dotnet test Vantage.sln -c Release --verbosity normal

      - name: Publish portable (self-contained single-file)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          dotnet publish src/Vantage.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=$v -o release/portable
          dotnet publish src/Vantage.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=$v -o release/portable

      - name: Publish lite (framework-dependent)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          dotnet publish src/Vantage.App -c Release -r win-x64 --self-contained false -p:DebugType=none -p:Version=$v -o release/lite
          dotnet publish src/Vantage.Cli -c Release -r win-x64 --self-contained false -p:DebugType=none -p:Version=$v -o release/lite

      - name: Publish installer payload (self-contained folder)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          dotnet publish src/Vantage.App -c Release -r win-x64 --self-contained true -p:DebugType=none -p:Version=$v -o release/payload
          dotnet publish src/Vantage.Cli -c Release -r win-x64 --self-contained true -p:DebugType=none -p:Version=$v -o release/payload

      - name: Extract this version's changelog section
        shell: pwsh
        run: |
          # The section between this version's heading and the next one. Embedded in the update
          # package so the in-app updater can show what a version contains before installing it,
          # with no network round-trip to the GitHub API.
          $v = '${{ steps.ver.outputs.version }}'
          # Explicit UTF-8: the changelog is full of em-dashes, and a wrong default mangles them.
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1).LineNumber
          if (-not $start) {
            if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
              # A real release with no notes would degrade the release page AND the
              # in-app updater to one bare line. Fail loudly instead.
              Write-Host "::error::No changelog section found for $v. Add '## [$v]' to CHANGELOG.md and re-tag."
              exit 1
            }
            Write-Host "::warning::No changelog section found for $v (dry run - continuing)"
            "Release $v" | Out-File release/notes-body.md -Encoding utf8
          } else {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
            # $end -gt 1 guards the empty-section case: [0..-1] would return the whole tail.
            $body = if ($end -gt 1) { $rest[0..($end - 2)] } elseif ($end) { @() } else { $rest }
            $body -join "`n" | Out-File release/notes-body.md -Encoding utf8
          }
          Get-Content release/notes-body.md

      - name: Build installer (Velopack)
        shell: pwsh
        run: |
          # Pinned to the Velopack version referenced by Vantage.App.csproj. An unpinned
          # vpk could one day emit a feed format the 1.2.0 UpdateManager in every shipped
          # client can't parse - which would break their updaters with no recovery path.
          # Bump both together, deliberately.
          dotnet tool install --global vpk --version 1.2.0
          # --splashProgressColor must be quoted: bare '#' opens a comment in PowerShell.
          # The splash is a 493x58 banner (the size vpk requires), generated by build/make-branding.ps1.
          vpk pack --packId VantageDisplayManager --packVersion ${{ steps.ver.outputs.version }} --packDir release/payload --mainExe Vantage.exe --packTitle "Vantage Display Manager" --packAuthors "Iñaki Zamores" --icon src/Vantage.App/Assets/vantage.ico --splashImage build/assets/vantage-splash.png --splashProgressColor '#5CE1FF' --releaseNotes release/notes-body.md --outputDir release/installer

      - name: Assemble assets + checksums
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force release/assets | Out-Null
          Copy-Item LICENSE, CHANGELOG.md release/portable/
          Copy-Item LICENSE, CHANGELOG.md release/lite/
          Compress-Archive -Path release/portable/* -DestinationPath "release/assets/Vantage-$v-win-x64-portable.zip" -CompressionLevel Optimal
          Compress-Archive -Path release/lite/* -DestinationPath "release/assets/Vantage-$v-win-x64-lite.zip" -CompressionLevel Optimal
          Copy-Item release/installer/VantageDisplayManager-win-Setup.exe release/assets/Vantage-Setup.exe
          Copy-Item release/installer/*.nupkg release/assets/
          Copy-Item release/installer/releases.win.json release/assets/
          $lines = Get-ChildItem release/assets -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Out-File release/assets/checksums.txt -Encoding ascii
          Get-ChildItem release/assets

      - name: Render release notes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $template = (Get-Content .github/release-body-template.md -Raw) -replace '\{VERSION\}', $v
          # Same changelog section the in-app updater shows, so the release page and the app
          # never disagree about what a version contains.
          $changes = Get-Content release/notes-body.md -Raw -Encoding utf8
          "$template`n`n---`n`n## What's in this version`n`n$changes" | Out-File release/notes.md -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantage-${{ steps.ver.outputs.version }}
          path: release/assets/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Vantage ${{ steps.ver.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release/notes.md
          generate_release_notes: true
          files: release/assets/*

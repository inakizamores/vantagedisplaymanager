name: 💡 Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Every time I dock my laptop I have to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like Vantage to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or other tools you've tried
    validations:
      required: false
